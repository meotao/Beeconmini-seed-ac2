name: Build ARM64 VM
on:
  push:
    branches: ['codex/armsr-vm']
    paths: ['.github/workflows/build-arm64-vm.yml', 'configs/armsr-armv8.config', 'configs/vm-apps.config', 'scripts/**', 'files-vm/**']
  workflow_dispatch:
    inputs:
      profile:
        description: '基础启动验证 / AC2 通用应用迁移'
        required: true
        default: baseline
        type: choice
        options: [baseline, full]
      enable_sfe:
        description: '启用 SFE，仅 full 模式有效'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']
permissions:
  contents: read
concurrency:
  group: arm64-vm-${{ github.ref }}-${{ inputs.profile || 'all' }}
  cancel-in-progress: false
env:
  REPO_URL: https://github.com/BeeconMini/immortalwrt
  REPO_COMMIT: 9d076a14becd3ba8301f9290ca69abd4049776d7
  BUILD_ROOT: /workdir/openwrt
  ENABLE_SFE: ${{ inputs.enable_sfe || 'false' }}
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.profile && format('["{0}"]', inputs.profile) || '["baseline","full"]') }}
    env:
      VM_PROFILE: ${{ matrix.profile }}
    defaults:
      run:
        shell: bash
    steps:
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
      - name: 检出配置仓库
        uses: actions/checkout@v4.2.2
      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils python3-setuptools \
            python3-yaml rsync swig unzip zlib1g-dev file wget curl libelf-dev libtool autoconf \
            automake cmake ninja-build pkgconf patch perl-modules-5.34 python3-pyelftools \
            device-tree-compiler cpio xsltproc qemu-utils qemu-system-arm qemu-efi-aarch64 \
            bzip2 xz-utils zstd subversion quilt libfuse-dev help2man asciidoc antlr3 gperf \
            libglib2.0-dev libgmp3-dev libmpc-dev libmpfr-dev libreadline-dev texinfo \
            libgnutls28-dev ecj fastjar llvm lld re2c p7zip-full squashfs-tools
          sudo mkdir -p /workdir
          sudo chown "$(id -u):$(id -g)" /workdir
      - name: 克隆固定版本源码
        working-directory: /workdir
        run: |
          git clone "$REPO_URL" openwrt
          git -C openwrt checkout "$REPO_COMMIT"
      - name: 配置 VM 与通用应用
        working-directory: ${{ env.BUILD_ROOT }}
        run: python3 "$GITHUB_WORKSPACE/scripts/prepare-vm.py"
      - name: 下载源码包
        working-directory: ${{ env.BUILD_ROOT }}
        run: make download -j16
      - name: 编译固件
        working-directory: ${{ env.BUILD_ROOT }}
        run: |
          if ! make -j"$(nproc)" > build.log 2>&1; then
            make -j1 V=s 2>&1 | tee -a build.log
          fi
          tail -100 build.log
      - name: 检查并整理 VM 镜像
        working-directory: ${{ env.BUILD_ROOT }}
        run: |
          python3 "$GITHUB_WORKSPACE/scripts/collect-vm-images.py" bin/targets/armsr/armv8 "$GITHUB_WORKSPACE/firmware"
          cp .config "$GITHUB_WORKSPACE/firmware/final.config"
          cp source.commit feeds.buildinfo.vm "$GITHUB_WORKSPACE/firmware/"
          cp "$GITHUB_WORKSPACE/scripts/run-vm-macos.sh" "$GITHUB_WORKSPACE/scripts/unpack-vm-image.py" "$GITHUB_WORKSPACE/firmware/"
          cp "$GITHUB_WORKSPACE/docs/VM-M4.md" "$GITHUB_WORKSPACE/firmware/"
          (cd "$GITHUB_WORKSPACE/firmware" && sha256sum ./* > SHA256SUMS)
      - name: 保留尚未验证的候选镜像
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ARM64-VM-candidate-unverified-${{ env.VM_PROFILE }}-${{ github.run_number }}
          path: firmware/
          if-no-files-found: error
          retention-days: 7
      - name: QEMU EFI 双网卡启动验证
        timeout-minutes: 20
        run: python3 scripts/smoke-vm.py firmware --accel tcg --timeout 900
      - name: 上传已通过启动验证的 VM 镜像
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ImmortalWrt-ARM64-VM-${{ env.VM_PROFILE }}-${{ github.run_number }}
          path: firmware/
          if-no-files-found: error
          retention-days: 30
      - name: 保留失败诊断
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ARM64-VM-diagnostics-${{ env.VM_PROFILE }}-${{ github.run_number }}
          path: |
            /workdir/openwrt/build.log
            firmware/final.config
            firmware/serial.log
            firmware/smoke-result.json
          if-no-files-found: warn
          retention-days: 7
