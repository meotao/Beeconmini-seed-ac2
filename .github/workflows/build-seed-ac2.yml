        }

        # ---- 复制到 OpenWrt rootfs overlay ----
        mkdir -p files
        cp -a "$GITHUB_WORKSPACE/files/." files/

        # ---- 权限 ----
        chmod 600 files/etc/AdGuardHome.yaml
        chmod 755 files/etc/uci-defaults/99-seed-ac2-defaults

        # ---- 基本验证 ----
        grep -q 'address: 0.0.0.0:3008' \
          files/etc/AdGuardHome.yaml || {
            echo "ERROR: AdGuard Home HTTP 配置异常"
            exit 1
          }

        grep -q '127.0.0.1:7874' \
          files/etc/AdGuardHome.yaml || {
            echo "ERROR: AdGuard Home → OpenClash DNS upstream 缺失"
            exit 1
          }

        grep -q "openclash.config.dns_port='7874'" \
          files/etc/uci-defaults/99-seed-ac2-defaults || {
            echo "ERROR: OpenClash DNS 端口预置缺失"
            exit 1
          }

        grep -q "AdGuardHome.AdGuardHome.redirect='none'" \
          files/etc/uci-defaults/99-seed-ac2-defaults || {
            echo "ERROR: AdGuard Home 出厂 DNS redirect 状态异常"
            exit 1
          }

        echo "=== RootFS overlay ==="
        find files -maxdepth 4 -type f -print

        echo "✓ SEED AC2 通用预置配置已整合"

    # ================================================================
    # Step 8: 合并配置 & defconfig
    # ================================================================
    - name: 合并配置 & defconfig
      working-directory: ${{ env.WORKSPACE }}/openwrt
      env:
        ENABLE_SFE: ${{ github.event.inputs.enable_sfe || 'true' }}
      run: |
        # 合并两层配置
        cat $GITHUB_WORKSPACE/configs/mt7981-common.config > .config
        cat $GITHUB_WORKSPACE/configs/seed-ac2.config >> .config

        # SFE 配置追加
        if [ "${ENABLE_SFE}" = "true" ]; then
          cat >> .config << 'EOF'
        CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_SHORTCUT_FE_CM=y
        CONFIG_PACKAGE_kmod-shortcut-fe=y
        CONFIG_PACKAGE_kmod-shortcut-fe-cm=y
        CONFIG_PACKAGE_kmod-fast-classifier=y
        EOF
        fi

        make defconfig

        echo "=== 诊断: AdGuard Home ==="
        grep -q '^CONFIG_PACKAGE_luci-app-adguardhome=y$' .config || {
          echo "ERROR: luci-app-adguardhome 未进入最终 .config"
          exit 1
        }

        grep -q '^CONFIG_PACKAGE_luci-i18n-adguardhome-zh-cn=y$' .config || \
          echo "WARNING: luci-app-adguardhome 中文语言包未启用"

        echo "✓ luci-app-adguardhome 已进入最终配置"

        echo "=== 诊断: OpenClash ==="
        grep -q '^CONFIG_PACKAGE_luci-app-openclash=y$' .config || {
          echo "ERROR: luci-app-openclash 未进入最终 .config"
          exit 1
        }

        echo "✓ luci-app-openclash 已进入最终配置"

        echo "=== 诊断: RootFS 预置配置 ==="
        test -f files/etc/AdGuardHome.yaml || {
          echo "ERROR: AdGuardHome.yaml 未进入 rootfs overlay"
          exit 1
        }

        test -x files/etc/uci-defaults/99-seed-ac2-defaults || {
          echo "ERROR: 99-seed-ac2-defaults 不存在或不可执行"
          exit 1
        }

        echo "✓ SEED AC2 预置配置已进入 rootfs overlay"

        echo "=== 诊断: turboacc 相关 ==="
        grep -iE "turboacc|fullcone|offload|bbr|shortcut|sfe" .config || echo "(none)"

        echo "=== 诊断: dnsmasq ==="
        grep -i "dnsmasq" .config | head -4 || echo "(none)"

    # ================================================================
    # Step 9: (可选) SSH 调试
    # ================================================================
    - name: SSH 调试
      uses: P3TERX/ssh2actions@v1.0.0
      if: github.event.inputs.enable_ssh == 'true'

    # ================================================================
    # Step 10: 下载源码包
    # ================================================================
    - name: 下载源码包
      working-directory: ${{ env.WORKSPACE }}/openwrt
      run: |
        make download -j16

        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    # ================================================================
    # Step 11: 编译固件
    # ================================================================
    - name: 编译固件
      working-directory: ${{ env.WORKSPACE }}/openwrt
      run: |
        echo "============================================"
        echo "  开始编译 | CPU: $(nproc) cores"
        echo "  $(date +'%Y-%m-%d %H:%M:%S')"
        echo "============================================"

        make -j$(nproc) || make -j1 V=s 2>&1 | tee build.log | tail -100

    # ================================================================
    # Step 12: 整理固件
    # ================================================================
    - name: 整理固件文件
      if: success()
      working-directory: ${{ env.WORKSPACE }}/openwrt
      run: |
        mkdir -p $GITHUB_WORKSPACE/firmware

        cp -f bin/targets/mediatek/filogic/*seed-ac2* \
              $GITHUB_WORKSPACE/firmware/ 2>/dev/null || true

        cp -f bin/targets/mediatek/filogic/sha256sums \
              $GITHUB_WORKSPACE/firmware/ 2>/dev/null || true

        cp -f bin/targets/mediatek/filogic/config.buildinfo \
              $GITHUB_WORKSPACE/firmware/ 2>/dev/null || true

        echo "=== 编译产物 ==="
        ls -lh $GITHUB_WORKSPACE/firmware/

    # ================================================================
    # Step 13: 上传 Artifacts
    # ================================================================
    - name: 上传固件到 Artifacts
      uses: actions/upload-artifact@v4.6.2
      if: success()
      with:
        name: ImmortalWrt-TurboACC-SEED-AC2-${{ github.run_number }}
        path: firmware/
        retention-days: 30

    # ================================================================
    # Step 14: 创建 Release
    # ================================================================
    - name: 生成 Release Tag
      id: tag
      if: success()
      run: |
        echo "release_tag=SEED-AC2-$(date +"%Y%m%d-%H%M")" >> $GITHUB_OUTPUT
        echo "release_date=$(date +"%Y-%m-%d %H:%M")" >> $GITHUB_OUTPUT

    - name: 创建 Release
      uses: softprops/action-gh-release@v2.3.2
      if: success()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: "SEED AC2 (${{ steps.tag.outputs.release_date }})"
        body: |
          ## ImmortalWrt + TurboACC 固件 (BeeconMini SEED AC2)
          - **源码**: BeeconMini/immortalwrt (Commit: ${{ env.REPO_COMMIT }})
          - **版本**: ImmortalWrt 24.10.1 | 内核 6.6
          - **设备**: BeeconMini SEED AC2 (MT7981B, 无 Wi-Fi, 9口 2.5G PoE)
          - **TurboACC**: Flow Offload + Fullcone NAT + BBR
          - **SFE**: ${{ github.event.inputs.enable_sfe || 'true' }}
          - **默认 IP**: 192.168.88.1 | 用户名: root | 密码: 无
        files: firmware/*
